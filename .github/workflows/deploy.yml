name: Deploy Notepad
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test privacy and offline behavior
        run: node test.cjs
      - name: Prepare static app
        run: |
          mkdir _site
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg *.png .nojekyll _site/
          sed -i "s/notepad-v1/notepad-${GITHUB_SHA}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
